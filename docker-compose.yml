services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: users
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./educationkhoj_db.sql:/docker-entrypoint-initdb.d/01_main.sql
      - ./lookup_tables.sql:/docker-entrypoint-initdb.d/02_lookup.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    env_file: .env
    environment:
      - DJANGO_DEBUG=True
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
